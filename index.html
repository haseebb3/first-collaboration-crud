<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <h2 class="bg-info text-center p-2">
      GitHub Collaboration CRUD using firebase and XHR
    </h2>
    <div class="container-fluid">
      <div class="row mt-3 mb-4">
        <div class="col-md-4">
          <div class="card">
            <div class="card-header text-center bg-info">
              <h4>Enter Student Details</h4>
            </div>
            <div class="card-body">
              <form id="studentForm">
                <div class="form-group">
                  <label for="fname">First Name</label>
                  <input type="text" id="fname" class="form-control" />
                </div>
                <div class="form-group">
                  <label for="lname">Last Name</label>
                  <input type="text" id="lname" class="form-control" />
                </div>
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="text" id="email" class="form-control" />
                </div>
                <div class="form-group">
                  <label for="contact">Contact</label>
                  <input type="text" id="contact" class="form-control" />
                </div>
                <button
                  class="btn btn-sm btn-block btn-info"
                  id="addStudentBtn"
                >
                  Add Student
                </button>
                <button
                  type="button"
                  class="btn btn-sm btn-block btn-info d-none"
                  id="updateStudentBtn"
                >
                  Update Student
                </button>
              </form>
            </div>
          </div>
        </div>

        <div class="col-md-8">
          <div class="card">
            <div class="card-header text-center bg-info">
              <h4>Your Students</h4>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-bordered" id="studentTable">
                  <thead class="bg-dark text-white">
                    <tr>
                      <th>Sr No</th>
                      <th>First Name</th>
                      <th>Last Name</th>
                      <th>Email</th>
                      <th>Contact</th>
                      <th>Edit</th>
                      <th>Delete</th>
                    </tr>
                  </thead>

                  <tbody id="studentsContainer">
                    <tr id="stdTr">
                      <td>1</td>
                      <td>John</td>
                      <td>Doe</td>
                      <td>john@gmail.com</td>
                      <td>8767403773</td>
                      <td><button onclick="onEdit(this)" class="btn btn-outline-info btn-sm">Edit</button></td>
                      <td><button onclick="onDelete(this)" class="btn btn-outline-danger btn-sm">Delete</button></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
  </body>
</html>
